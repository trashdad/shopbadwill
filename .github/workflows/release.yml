name: Release

# Tag push (vX.Y.Z) -> build, lint, package, optionally sign Firefox, publish a GitHub release.
# Manual run (workflow_dispatch) with `draft` left at true -> same pipeline, but the release is
# a DRAFT and no tag is created (a draft release does not create its tag until it is published).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      draft:
        description: 'Draft only: create a draft release and no tag. Required unless run on a tag.'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  # Public OAuth client id for the Chrome manifest's oauth2 block (set as a repo variable).
  # Empty -> the key is omitted from the manifest.
  SBW_GOOGLE_CLIENT_ID: ${{ vars.SBW_GOOGLE_CLIENT_ID }}

jobs:
  build:
    name: build, lint, package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4.1.0 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 25
          cache: pnpm

      - name: Read version and check the tag matches package.json
        id: meta
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && [ "${{ inputs.draft }}" != "true" ]; then
            echo "A non-draft release must run on a tag; use the draft input from a branch." >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:firefox
      - run: pnpm lint:webext

      - name: Package (Chrome zip, source zip, checksums)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist
          # Chrome: "Load unpacked" from the extracted zip. -X drops extra file attributes.
          (cd .output/chrome-mv3 && find . -type f | LC_ALL=C sort | zip -X -q "$GITHUB_WORKSPACE/dist/shopbadwill-${VERSION}-chrome.zip" -@)
          # Source for AMO and for reproducing the Firefox build: tracked files at this commit only.
          # git archive output depends only on the commit, so it is reproducible.
          git archive --format=zip --prefix="shopbadwill-${VERSION}/" \
            -o "dist/shopbadwill-${VERSION}-sources.zip" HEAD
          ls -l dist

      - name: Sign Firefox (unlisted); skipped without AMO secrets
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          pnpm sign:firefox "dist/shopbadwill-${VERSION}-sources.zip"
          if compgen -G ".output/signed/*.xpi" > /dev/null; then
            cp .output/signed/*.xpi dist/
          fi

      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes from CHANGELOG.md
        run: pnpm --silent release notes > dist-notes.md

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: release-dist
          path: |
            dist/
            dist-notes.md
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # only this job can create releases
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: release-dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${{ inputs.draft }}" != "true" ]; then
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "ShopBadwill ${VERSION}" --notes-file dist-notes.md --verify-tag
          else
            # Draft: no tag is created. The name is unique per run so reruns never collide.
            gh release create "v${VERSION}-draft.${GITHUB_RUN_ID}" dist/* \
              --draft --target "${GITHUB_SHA}" \
              --title "ShopBadwill ${VERSION} (draft)" --notes-file dist-notes.md
          fi
